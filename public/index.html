<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tiddl — TIDAL Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5df9'/%3E%3Cstop offset='1' stop-color='%2300c9ff'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b9d'/%3E%3Cstop offset='1' stop-color='%237c5df9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23a)'/%3E%3Ccircle cx='32' cy='32' r='23' fill='%230d0f1a'/%3E%3Ccircle cx='32' cy='32' r='9.5' fill='url(%23b)'/%3E%3Cpath d='M32 27v9M28.2 32.6 32 36.4l3.8-3.8' fill='none' stroke='%23fff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="vinyl-bg" id="vinylBg" aria-hidden="true"></div>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Header -->
  <header class="header">
    <a class="logo" href="#" title="Home">
      <svg class="logo-svg" viewBox="0 0 64 64" width="40" height="40" aria-hidden="true">
        <defs>
          <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5df9"/><stop offset="1" stop-color="#00c9ff"/></linearGradient>
          <linearGradient id="lgLabel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b9d"/><stop offset="1" stop-color="#7c5df9"/></linearGradient>
          <radialGradient id="lgDisc" cx="0.5" cy="0.5" r="0.5"><stop offset="0.55" stop-color="#151827"/><stop offset="1" stop-color="#07080f"/></radialGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="url(#lgBg)"/>
        <circle cx="32" cy="32" r="23" fill="url(#lgDisc)"/>
        <g fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="1">
          <circle cx="32" cy="32" r="20"/><circle cx="32" cy="32" r="17.5"/><circle cx="32" cy="32" r="15"/><circle cx="32" cy="32" r="12.5"/>
        </g>
        <path d="M13.6 25.5A20 20 0 0 1 25.5 13.6" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M50.4 38.5A20 20 0 0 1 38.5 50.4" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="32" cy="32" r="9.5" fill="url(#lgLabel)"/>
        <path d="M32 27v9M28.2 32.6 32 36.4l3.8-3.8" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="logo-text">
        <span class="logo-title">tiddl<span class="logo-dot">.</span></span>
        <span class="logo-sub">TIDAL Downloader</span>
      </div>
    </a>
    <div class="header-right">
      <div class="conn" title="Collegamento con il server">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Connessione…</span>
      </div>
      <button class="btn-auth" id="btnAuth">
        <span class="auth-dot" id="authDot"></span>
        <span id="authLabel">Accedi a TIDAL</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- Colonna principale -->
    <main class="content">
      <section class="card search-card">
        <div class="search-input-wrap">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchQuery" class="search-input" placeholder="Cerca artisti, album, brani o playlist…" autocomplete="off" spellcheck="false" />
          <button class="search-clear" id="searchClear" title="Cancella" style="display:none">✕</button>
          <kbd class="search-kbd">/</kbd>
        </div>
        <div class="filter-chips" id="filterChips">
          <button class="chip active" data-type="artist">🎤 Artisti</button>
          <button class="chip active" data-type="album">💿 Album</button>
          <button class="chip active" data-type="track">🎵 Brani</button>
          <button class="chip active" data-type="playlist">📋 Playlist</button>
        </div>
      </section>

      <section id="view" class="view"></section>
    </main>

    <!-- Colonna laterale -->
    <aside class="sidebar">
      <section class="card panel">
        <h3 class="panel-title">Impostazioni download</h3>

        <label class="option-label" for="quality">Qualità audio</label>
        <div class="select-wrap">
          <select id="quality" class="option-select">
            <option value="max">💎 Max — Hi-Res fino a 24-bit</option>
            <option value="high" selected>🎼 Lossless — FLAC 16-bit</option>
            <option value="normal">🎧 Alta — AAC 320k</option>
            <option value="low">📱 Bassa — AAC 96k</option>
          </select>
          <div class="select-arrow">▾</div>
        </div>

        <label class="option-label" for="downloadPath">Cartella</label>
        <div class="path-row">
          <input type="text" id="downloadPath" class="option-input" placeholder="~/Music/tiddl" spellcheck="false" />
          <button class="icon-btn" id="btnBrowse" title="Sfoglia…">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="icon-btn" id="btnOpenFolder" title="Apri nel Finder">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </button>
        </div>

        <label class="toggle">
          <input type="checkbox" id="saveCovers" checked>
          <span class="toggle-ui"></span>
          <span>Copertine e testi</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="includeSingles">
          <span class="toggle-ui"></span>
          <span>EP e singoli nella discografia</span>
        </label>

        <details class="advanced">
          <summary>Avanzate</summary>
          <label class="option-label" for="template">Nome dei file</label>
          <input type="text" id="template" class="option-input" placeholder="{album.artist}/{album.title}/{item.title}" spellcheck="false" />
          <p class="hint">Lascia vuoto per usare quello di tiddl.</p>
        </details>
      </section>

      <section class="card panel">
        <h3 class="panel-title">Hai un link?</h3>
        <div class="link-row">
          <input type="url" id="tidalUrl" class="option-input" placeholder="https://tidal.com/album/…" autocomplete="off" spellcheck="false" />
          <button class="icon-btn" id="btnPaste" title="Incolla">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
        <div class="link-actions">
          <span class="type-badge" id="typeBadge" style="display:none"></span>
          <button class="btn-primary btn-sm" id="btnDownloadUrl">⬇ Scarica</button>
        </div>
      </section>

      <section class="card panel queue-panel">
        <div class="panel-head">
          <h3 class="panel-title">Download <span class="count" id="queueCount"></span></h3>
          <button class="btn-text" id="btnClearHistory">Svuota storico</button>
        </div>
        <div id="queue" class="queue"></div>
      </section>
    </aside>
  </div>

  <!-- Barra selezione multipla -->
  <div class="selection-bar" id="selectionBar">
    <span id="selectionText"></span>
    <button class="btn-text" id="btnSelectAll">Seleziona tutti</button>
    <button class="btn-text" id="btnSelectNone">Annulla</button>
    <button class="btn-primary btn-sm" id="btnDownloadSelected">⬇ Scarica selezionati</button>
  </div>

  <!-- Account -->
  <div class="modal-overlay" id="authModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2>Account TIDAL</h2>
        <button class="modal-close" data-close="authModal">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc" id="authDesc"></p>
        <div id="authLog" class="auth-log" style="display:none"></div>
        <div id="authUrlBox" class="auth-url-box" style="display:none">
          <p class="auth-url-label">🔗 Se non si è aperta, apri questa pagina per confermare:</p>
          <a id="authUrl" href="#" target="_blank" rel="noopener" class="auth-url-link"></a>
        </div>
        <button class="btn-primary" id="btnStartAuth">🔐 Accedi con TIDAL</button>
        <button class="btn-text danger" id="btnLogout" style="display:none">Disconnetti account</button>
      </div>
    </div>
  </div>

  <!-- Log -->
  <div class="modal-overlay" id="logModal" style="display:none">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 id="logModalTitle">Log</h2>
        <button class="modal-close" data-close="logModal">✕</button>
      </div>
      <div class="modal-body">
        <div id="logContent" class="log-content"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
